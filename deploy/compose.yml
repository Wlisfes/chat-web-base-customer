name: chat-web-cloud

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '20m'
        max-file: '30'

services:
    customer:
        image: ${IMAGE:?IMAGE is required}
        container_name: chat-web-cloud-customer
        restart: unless-stopped
        logging: *default-logging
        init: true
        environment:
            NODE_ENV: production
            NODE_WEB_CLIENT_SSR_PORT: 5480
            TZ: Asia/Shanghai
        networks:
            - cloud
        healthcheck:
            test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:5480/health').then(r=>r.text()).then(t=>{if(!t.startsWith('healthy'))process.exit(1)}).catch(()=>process.exit(1))"]
            interval: 15s
            timeout: 5s
            retries: 6
            start_period: 25s
        mem_limit: 768m
        mem_reservation: 192m
        cpus: 1
        pids_limit: 256

networks:
    cloud:
        external: true
        name: chat-web-cloud
