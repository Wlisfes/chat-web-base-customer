# web.lisfes.cn 由云端 Nginx 反代到客户门户 SSR 容器。

server {
    listen 80;
    listen [::]:80;
    server_name web.lisfes.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $customer_upstream chat-web-cloud-customer:5480;
        proxy_pass http://$customer_upstream;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name web.lisfes.cn;

    ssl_certificate /etc/letsencrypt/live/web.lisfes.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/web.lisfes.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /health {
        access_log off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $customer_upstream chat-web-cloud-customer:5480;
        proxy_pass http://$customer_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $customer_upstream chat-web-cloud-customer:5480;
        proxy_pass http://$customer_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
